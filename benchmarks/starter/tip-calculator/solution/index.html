<!doctype html><html lang="en"><meta charset="utf-8"><title>Tip calculator</title>
<style>body{font:18px system-ui;max-width:32rem;margin:3rem auto}label{display:block;margin:1rem 0}input{float:right}output{display:block;margin-top:1rem}</style>
<h1>Tip calculator</h1><form><label>Bill <input id="bill" type="number" min="0" step="any" value="50"></label><label>Tip % <input id="percent" type="number" min="0" step="any" value="20"></label><label>People <input id="people" type="number" min="1" step="1" value="2"></label><button>Calculate</button><output></output></form>
<script type="module">import{calcTip}from'./tip.js';document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const output=document.querySelector('output');try{const r=calcTip(+document.querySelector('#bill').value,+document.querySelector('#percent').value,+document.querySelector('#people').value);output.textContent=`Tip: $${r.tip.toFixed(2)}; each: $${r.perPerson.toFixed(2)}`;}catch(error){output.textContent=error.message;}});</script></html>
