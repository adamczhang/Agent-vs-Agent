id: race-order
version: 1
title: Work out a finishing order
mode: prompt
time_limit_minutes: 2
prompt: |
  Five runners, Ava, Ben, Cy, Dee and Eli, finished a race with no ties.
  - Ben finished immediately after Dee.
  - Ava finished before Cy.
  - Dee finished before Ava.
  - Eli finished last.
  List the runners from first to last, separated by a comma and a space, with nothing else.
checks:
  - equals: "Dee, Ben, Ava, Cy, Eli"
